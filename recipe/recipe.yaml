context:
  version: "0.8.9"

package:
  name: gvproxy
  version: ${{ version }}

source:
  url: https://github.com/containers/gvisor-tap-vsock/archive/v${{ version }}.tar.gz
  sha256: 6cbcb7959a5d90b59253ea6d8bdf0285e2cfbc3b301398704b41e3069293f4fb

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('go-cgo') }}
    - go-licenses

tests:
  - script:
      - gvproxy --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - license-files_gvproxy/
    - if: win
      then: license-files_win-sshproxy/
      else: license-files_qemu-wrapper/
    - if: linux
      then: license-files_vm/
  summary: A new network stack based on gVisor
  homepage: https://github.com/containers/gvisor-tap-vsock
  repository: https://github.com/containers/gvisor-tap-vsock

extra:
  recipe-maintainers:
    - danielnachun
